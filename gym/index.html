<!DOCTYPE html>
<html lang="ja">
<head>

<title>松田ジム</title>
<style>
:root{
  --bg:#f4f2ee; --card:#fff; --ink:#1b1b1b; --muted:#6d6a64; --line:#e3dfd8;
  --accent:#c8231e; --ok:#1f7a4d; --warn:#b5690c;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:120px}
header.top{background:#141414;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 0;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:19px;font-weight:900;margin:0;letter-spacing:.02em}
.brand .badge{font-size:11px;background:var(--accent);padding:2px 8px;border-radius:99px;font-weight:700}
.brand .grow{flex:1}
nav.tabs{display:flex;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1;min-width:max-content;background:none;border:0;padding:11px 10px;color:#aaa;font-weight:700;font-size:14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:#fff;border-color:var(--accent)}
nav.tabs .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;line-height:18px}
h2.sec{font-size:20px;font-weight:900;margin:22px 0 4px}
p.lead{color:var(--muted);font-size:13px;margin:0 0 14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 10px;background:var(--card);border-radius:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:2px 16px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip span{margin-left:5px;color:var(--muted);font-weight:400}
.chip.on{background:#141414;border-color:#141414;color:#fff}
.chip.on span{color:#bbb}
.group-h{font-size:13px;color:var(--muted);font-weight:700;margin:18px 2px 8px}
/* members */
.member{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:72px;height:72px;border-radius:8px;object-fit:cover;background:#8f897e;display:grid;place-items:center;font-weight:900;color:#fff;font-size:22px}
.member .name{font-size:17px;font-weight:900}
.member .kana{font-size:11px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#efece6;color:#4a4740}
.tag.pro{background:#141414;color:#fff}
.tag.rank{background:#fbe9e8;color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.admin-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
/* events */
.ev-date{display:flex;align-items:baseline;gap:8px}
.ev-date b{font-size:20px;font-weight:900}
.ev-date span{color:var(--muted);font-size:13px}
.ev-title{font-weight:900;font-size:16px;margin-top:2px}
.ev-block{margin-top:10px;font-size:14px}
.ev-block h4{margin:0 0 4px;font-size:12px;color:var(--muted)}
.ev-block .pre{white-space:pre-wrap}
.bouts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.bout{border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.bout-no{font-size:12px;font-weight:700;color:var(--accent)}
.bout-vs{font-weight:700;font-size:15px;line-height:1.5}
.bout-info{font-size:12px;color:var(--muted);line-height:1.5}
.assign{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.assign dt{color:var(--muted);font-size:13px}
.assign dd{margin:0;font-weight:700}
.past{opacity:.6}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;margin:16px 2px 8px}
/* manual */
.manual h3{margin:0 0 6px;font-size:16px;font-weight:900}
.manual .body{font-size:14px;line-height:1.75;white-space:pre-wrap}
/* fab */
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.2);border-radius:99px;padding:14px 20px;font-size:15px}
footer{text-align:center;padding:10px 0 30px}
footer button{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:900}
label.f{display:block;margin-bottom:12px;font-size:13px;font-weight:700;color:#4a4740}
label.f small{font-weight:400;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
label.f textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.photo-pick .avatar{width:96px;height:96px}
.err{color:var(--accent);font-size:13px;margin:6px 0}
.note{font-size:12px;color:var(--muted);margin:4px 0 12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#141414;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90%}
.loading{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
</style>

<script type="module">

  {sei:"宮澤", mei:"蓮斗", kana:"みやざわ れんと", category:"プロ選手", weightClass:"ミニマム級", birthDate:"2003-03-18", hometown:"愛知県津島市", record:"14戦9勝(3KO)3敗2分", ranking:"日本ミニマム級3位", rankingDetail:"WBC世界ユース・ミニマム級王者／OPBFミニマム級7位／WBO-APミニマム級15位／WBCミニマム級21位", note:"身長158cm・オーソドックス\n元日本ユース・ミニマム級王者\nプロデビュー：2021年7月18日"},

];
const EVENT_SEED_VER = 3;
const SEED_EVENTS = [
  {date:"2026-12-13", time:"14:00", title:"SOUL FIGHTING", venue:"愛知・一宮総合体育館",
   bouts:"第8試合（メイン）｜宮澤 蓮斗 vs ジュニー・ブガス（フィリピン）｜WBC世界ユース・ミニマム級タイトルマッチ8回戦\n第6試合｜犬塚 音也 vs 遠藤 龍匠（M.T）｜WBC世界ユース・フライ級王座決定8回戦\n第4試合｜島袋 友樹 vs 石井 日向（ARITOMI）｜スーパーバンタム級4回戦\n第2試合｜安井 新空 vs 高橋 昭麿（ARITOMI）｜49.5kg契約4回戦\n第1試合｜沖島 由汰 vs 尾崎 勇海（ARITOMI）｜61.0kg契約4回戦",
   assignments:[], memo:"全8試合。試合順はボクシングモバイルの掲載順から（変更の可能性あり）。\n出典：ボクシングモバイル（2026年11月22日確認）"},
  {date:"2027-01-16", time:"17:45", title:"DYNAMIC GLOVE on U-NEXT Vol.51", venue:"後楽園ホール",
   bouts:"セミファイナル｜村田 碧 vs 宮下 聡帥（竜一屋）｜日本ユース・スーパーフライ級タイトルマッチ8回戦",
   assignments:[], memo:"メインは日本スーパーライト級タイトルマッチ（渡来 美響 vs 池田 竜司）。\n出典：ボクシングモバイル（2026年11月22日確認）"}
];
const findEvent = s => state.events.find(e => e.date===s.date && (e.title||"")===s.title);
const seedEventsLeft = () => SEED_EVENTS.filter(s => { const e = findEvent(s); return !e || (e.seedVer||0) < EVENT_SEED_VER; });
const findMember = s => state.members.find(m => m.sei===s.sei && (m.mei||"")===s.mei);
const seedLeft = () => SEED_MEMBERS.filter(s => { const m = findMember(s); return !m || (m.seedVer||0) < SEED_VER; });
function ageOf(m){
  if(m.birthDate){ const b=new Date(m.birthDate+"T00:00:00"), n=new Date(); if(!isNaN(b)){ let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a; } }
  return m.age || "";
}

const state = { tab:"members", members:[], events:[], pending:[], manual:null, ranking:null, isAdmin:false, ready:{members:false,events:false} };
let unsubPending = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["日","月","火","水","木","金","土"];
function fmtDate(d){ if(!d) return ""; const t=new Date(d+"T00:00:00"); if(isNaN(t)) return d; return `${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日（${WD[t.getDay()]}）`; }
function todayStr(){ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",2600); }
function initial(m){ return esc((m.sei||"?").slice(0,1)); }
function avatar(m){ return m.photo ? `<img class="avatar" src="${esc(m.photo)}" alt="">` : `<div class="avatar">${initial(m)}</div>`; }
function errMsg(e){
  const c = e && e.code || "";
  if(c.includes("permission")) return "権限がありません。設定ルールを確認してください。";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "メールアドレスかパスワードが違います。";
  if(c.includes("too-many")) return "試行回数が多すぎます。しばらく待ってください。";
  if(c.includes("unavailable")||c.includes("network")) return "通信できません。電波を確認してください。";
  return "エラーが起きました（" + (c||e?.message||"不明") + "）";
}
function sortMembers(a,b){
  const ca=CATEGORIES.indexOf(catOf(a)), cb=CATEGORIES.indexOf(catOf(b));
  if(ca!==cb) return (ca<0?99:ca)-(cb<0?99:cb);
  if((b.grade||0)!==(a.grade||0)) return (b.grade||0)-(a.grade||0);
  const wa=CLASSES.indexOf(a.weightClass), wb=CLASSES.indexOf(b.weightClass);
  if(wa!==wb) return (wa<0?99:wa)-(wb<0?99:wb);
  return (a.kana||a.sei||"").localeCompare(b.kana||b.sei||"","ja");
}

/* resize a photo to a small JPEG data URL so it fits in Firestore */
function shrinkPhoto(file, max=480, quality=0.78){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const w = Math.round(img.width*s), h = Math.round(img.height*s);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q = quality, out = c.toDataURL("image/jpeg", q);
      while(out.length > 250000 && q > 0.4){ q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("写真を読み込めませんでした")); };
    img.src = url;
  });
}

/* ---------- data ---------- */
onSnapshot(collection(db,"members"), snap=>{
  state.members = snap.docs.map(d=>({id:d.id,...d.data()})).sort(sortMembers);
  state.ready.members = true; render();
}, e=>{ state.ready.members = true; state.loadError = errMsg(e); render(); });
onSnapshot(collection(db,"events"), snap=>{
  state.events = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||""));
  state.ready.events = true; render();
}, e=>{ state.ready.events = true; render(); });
onSnapshot(doc(db,"meta","manual"), d=>{ state.manual = d.exists() ? (d.data().sections||[]) : null; render(); }, ()=>{});
onSnapshot(doc(db,"meta","ranking"), d=>{ state.ranking = d.exists() ? d.data() : null; render(); }, ()=>{});

onAuthStateChanged(auth, user=>{
  state.isAdmin = !!user && user.uid === ADMIN_UID;
  if(user && !state.isAdmin){ signOut(auth); toast("このアカウントは管理者ではありません"); }

  $("#adminBtn").textContent = state.isAdmin ? "ログアウト" : "管理者ログイン";
  if(state.isAdmin && !unsubPending){
    unsubPending = onSnapshot(collection(db,"pending"), snap=>{
      state.pending = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.submittedAt?.seconds||0)-(b.submittedAt?.seconds||0));
      render();
    }, e=>toast(errMsg(e)));
  }
  if(!state.isAdmin && unsubPending){ unsubPending(); unsubPending=null; state.pending=[]; if(state.tab==="pending") state.tab="members"; }
  render();
});

/* ---------- render ---------- */
function renderTabs(){
  const tabs = [["members","所属者"],["events","試合予定"],["ranking","ランキング"],["manual","手順書"]];
  if(state.isAdmin) tabs.push(["pending","申請"]);
  $("#tabs").innerHTML = tabs.map(([k,l])=>`<button data-tab="${k}" class="${state.tab===k?"on":""}">${l}${k==="pending"&&state.pending.length?`<span class="dot">${state.pending.length}</span>`:""}</button>`).join("");
}
function render(){
  renderTabs();
  const v = $("#view");
  const fab = $("#fab");
  fab.hidden = true;
  if(state.tab==="members"){
    v.innerHTML = viewMembers();
    fab.hidden = false; fab.textContent = state.isAdmin ? "＋ 所属者を追加" : "＋ 登録する"; fab.dataset.act = state.isAdmin ? "member-new" : "register";
  } else if(state.tab==="events"){
    v.innerHTML = viewEvents();
    if(state.isAdmin){ fab.hidden=false; fab.textContent="＋ 試合を追加"; fab.dataset.act="event-new"; }
  } else if(state.tab==="ranking"){
    v.innerHTML = viewRanking();
  } else if(state.tab==="manual"){
    v.innerHTML = viewManual();
    if(state.isAdmin){ fab.hidden=false; fab.textContent="＋ 項目を追加"; fab.dataset.act="manual-new"; }
  } else if(state.tab==="pending"){
    v.innerHTML = viewPending();
  }
}

function memberCard(m){
  const tags = [];
  if(catOf(m)) tags.push(`<span class="tag ${catOf(m)==="プロ選手"?"pro":""}">${esc(gradeLabel(m)||catOf(m))}</span>`);
  if(m.weightClass) tags.push(`<span class="tag">${esc(m.weightClass)}</span>`);
  if(m.ranking) tags.push(`<span class="tag rank">${esc(m.ranking)}</span>`);
  return `<div class="card">
    <div class="member">${avatar(m)}
      <div class="grow">
        <div class="kana">${esc(m.kana)}</div>
        <div class="name">${esc(m.sei)} ${esc(m.mei)}</div>
        <div class="tags">${tags.join("")}</div>
        ${(ageOf(m)||m.hometown)?`<div class="sub">${[ageOf(m)!==""?esc(ageOf(m))+"歳":"", m.hometown?esc(m.hometown)+"出身":""].filter(Boolean).join("・")}</div>`:""}
        ${m.rankingDetail?`<div class="sub" style="color:var(--accent)">${esc(m.rankingDetail)}</div>`:""}
        ${m.record?`<div class="sub">戦績：${esc(m.record)}</div>`:""}
        ${m.note?`<div class="sub">${esc(m.note)}</div>`:""}
      </div>
    </div>
    ${state.isAdmin?`<div class="admin-actions"><button class="btn sm" data-act="member-edit" data-id="${m.id}">編集</button><button class="btn sm danger" data-act="member-del" data-id="${m.id}">削除</button></div>`:""}
  </div>`;
}
function viewMembers(){
  if(!state.ready.members) return `<div class="loading">読み込み中…</div>`;
  const f = state.memberFilter || "すべて";
  const shown = f==="すべて" ? state.members : state.members.filter(m=>catOf(m)===f);
  let h = `<h2 class="sec">所属者</h2><p class="lead">${state.members.length}人</p>`;
  h += `<div class="chips">${["すべて",...CATEGORIES].map(c=>{ const n = c==="すべて"?state.members.length:state.members.filter(m=>catOf(m)===c).length;
    return `<button class="chip ${c===f?"on":""}" data-act="filter" data-cat="${esc(c)}">${esc(c)}<span>${n}</span></button>`; }).join("")}</div>`;
  if(state.isAdmin && seedLeft().length) h += `<div class="card" style="margin-bottom:12px"><b>ボクシングモバイルの選手を取り込む</b><div class="sub">松田ジム所属のプロ${seedLeft().length}人（${esc(seedLeft().map(s=>s.sei).join("・"))}）を、階級・生年月日・戦績・ランキング付きで登録します。登録済みの選手は最新の内容に更新します（顔写真はそのまま）。</div><div class="admin-actions"><button class="btn primary sm" data-act="seed-import">取り込む</button></div></div>`;
  if(state.loadError) return h + `<div class="empty">${esc(state.loadError)}</div>`;
  if(!shown.length) return h + `<div class="empty">${f==="すべて"?"まだ登録がありません。<br>右下の「＋ 登録する」から登録できます。":esc(f)+"の登録はまだありません。"}</div>`;
  if(f!=="すべて") return h + `<div class="list">${shown.map(memberCard).join("")}</div>`;
  const groups = {};
  shown.forEach(m=>{ const k=catOf(m)||"その他"; (groups[k]=groups[k]||[]).push(m); });
  Object.keys(groups).forEach(k=>{ h += `<div class="group-h">${esc(k)}（${groups[k].length}）</div><div class="list">${groups[k].map(memberCard).join("")}</div>`; });
  return h;
}

function eventCard(e, past){
  const assigns = (e.assignments||[]).filter(a=>a.role||a.name);
  return `<div class="card ${past?"past":""}">
    <div class="ev-date"><b>${esc(fmtDate(e.date))}</b>${e.time?`<span>${esc(e.time)}〜</span>`:""}</div>
    <div class="ev-title">${esc(e.title||"試合")}</div>
    ${e.venue?`<div class="sub">📍 ${esc(e.venue)}</div>`:""}
    ${e.bouts?`<div class="ev-block"><h4>出場選手</h4>${boutsHtml(e.bouts)}</div>`:""}
    ${assigns.length?`<div class="ev-block"><h4>サポート担当</h4><dl class="assign">${assigns.map(a=>`<dt>${esc(a.role)}</dt><dd>${esc(a.name)}</dd>`).join("")}</dl></div>`:""}
    ${e.memo?`<div class="ev-block"><h4>メモ</h4><div class="pre">${esc(e.memo)}</div></div>`:""}
    ${state.isAdmin?`<div class="admin-actions"><button class="btn sm" data-act="event-edit" data-id="${e.id}">編集</button><button class="btn sm danger" data-act="event-del" data-id="${e.id}">削除</button></div>`:""}
  </div>`;
}
function boutsHtml(text){
  return `<div class="bouts">${text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p = l.split(/[｜|]/).map(x=>x.trim());
    if(p.length>=3) return `<div class="bout"><div class="bout-no">${esc(p[0])}</div><div class="bout-vs">${esc(p[1])}</div><div class="bout-info">${esc(p.slice(2).join(" "))}</div></div>`;
    if(p.length===2) return `<div class="bout"><div class="bout-vs">${esc(p[0])}</div><div class="bout-info">${esc(p[1])}</div></div>`;
    return `<div class="bout"><div class="bout-vs">${esc(l)}</div></div>`;
  }).join("")}</div>`;
}
function viewEvents(){
  if(!state.ready.events) return `<div class="loading">読み込み中…</div>`;
  const t = todayStr();
  const up = state.events.filter(e=>(e.date||"")>=t), past = state.events.filter(e=>(e.date||"")<t).reverse();
  let h = `<h2 class="sec">試合予定</h2><p class="lead">試合日・会場・サポート担当</p>`;
  if(state.isAdmin && seedEventsLeft().length) h += `<div class="card" style="margin-bottom:12px"><b>ボクシングモバイルの試合予定を取り込む・更新する</b><div class="sub">${seedEventsLeft().map(e=>esc(fmtDate(e.date)+" "+e.title)).join("<br>")}</div><div class="admin-actions"><button class="btn primary sm" data-act="seed-events">取り込む</button></div></div>`;
  h += up.length ? `<div class="list">${up.map(e=>eventCard(e,false)).join("")}</div>` : `<div class="empty">予定されている試合はありません。</div>`;
  if(past.length) h += `<details class="more"><summary>終わった試合（${past.length}）</summary><div class="list">${past.map(e=>eventCard(e,true)).join("")}</div></details>`;
  return h;
}

function viewRanking(){
  const ranked = state.members.filter(m=>m.ranking);
  const r = state.ranking || {};
  let h = `<h2 class="sec">ランキング</h2><p class="lead">${r.updated?`最終更新：${esc(fmtDate(r.updated))}`:"最終更新日は未設定です"}</p>`;
  h += ranked.length ? `<div class="list">${ranked.map(m=>`<div class="card"><div class="member">${avatar(m)}<div class="grow"><div class="name">${esc(m.sei)} ${esc(m.mei)}</div><div class="tags"><span class="tag">${esc(m.weightClass||"")}</span></div><div class="sub" style="color:var(--accent);font-weight:700">${esc(m.ranking)}</div>${m.rankingDetail?`<div class="sub">${esc(m.rankingDetail)}</div>`:""}${m.record?`<div class="sub">${esc(m.record)}</div>`:""}</div></div></div>`).join("")}</div>`
    : `<div class="empty">ランキング入りしている選手はいません。</div>`;
  if(r.note) h += `<div class="card" style="margin-top:10px"><div class="sub" style="margin:0">${esc(r.note)}</div></div>`;
  h += `<div class="row" style="margin-top:14px"><a class="btn sm" href="https://www.jbc.or.jp/" target="_blank" rel="noopener">JBC（日本ランキング）</a><a class="btn sm" href="https://boxmob.jp/" target="_blank" rel="noopener">ボクシングモバイル</a></div>`;
  if(state.isAdmin) h += `<p class="note" style="margin-top:14px">各選手のランキングは、選手タブの「編集」で書き換えます。</p><button class="btn" data-act="ranking-edit">最終更新日・メモを編集</button>`;
  return h;
}

function viewManual(){
  const secs = state.manual || DEFAULT_MANUAL;
  let h = `<h2 class="sec">試合サポートの手順書</h2><p class="lead">試合前から試合後までの流れ</p><div class="list manual">`;
  h += secs.map((s,i)=>`<div class="card"><h3>${esc(s.title)}</h3><div class="body">${esc(s.body)}</div>
    ${state.isAdmin?`<div class="admin-actions">${i>0?`<button class="btn sm" data-act="manual-up" data-i="${i}">↑</button>`:""}<button class="btn sm" data-act="manual-edit" data-i="${i}">編集</button><button class="btn sm danger" data-act="manual-del" data-i="${i}">削除</button></div>`:""}</div>`).join("");

}

function viewPending(){
  let h = `<h2 class="sec">登録の申請</h2><p class="lead">「登録する」を押すと選手一覧に載ります</p>`;

function openSheet(html){ $("#sheet").innerHTML = html; $("#sheetBg").classList.add("show"); }
function closeSheet(){ $("#sheetBg").classList.remove("show"); $("#sheet").innerHTML=""; }
$("#sheetBg").addEventListener("click", e=>{ if(e.target.id==="sheetBg") closeSheet(); });

const opt = (list, val) => `<option value="">選んでください</option>` + list.map(x=>`<option ${x===val?"selected":""}>${esc(x)}</option>`).join("");

function memberForm(m, mode){
  // mode: "register" (public), "new" / "edit" (admin)
  const admin = mode!=="register";
  const title = mode==="register" ? "所属者の登録" : mode==="new" ? "所属者を追加" : "所属者を編集";
  openSheet(`<h3>${title}</h3>
    ${mode==="register"?`<p class="note">送信した内容は、管理者が確認してから掲載されます。送信後は自分では変更できないので、直したいときは管理者に伝えてください。</p>`:""}
    <div class="photo-pick"><div id="pv">${avatar(m)}</div>
      <div><label class="btn" style="display:inline-block">顔写真を選ぶ<input type="file" id="fPhoto" accept="image/*" hidden></label>
      ${admin&&m.photo?`<div><button class="btn sm danger" id="rmPhoto" style="margin-top:6px">写真を外す</button></div>`:""}</div></div>
    <div class="two"><label class="f">名前（姓）<input id="fSei" maxlength="20" value="${esc(m.sei)}"></label><label class="f">名前（名）<input id="fMei" maxlength="20" value="${esc(m.mei)}"></label></div>
    <label class="f">ふりがな<input id="fKana" maxlength="40" value="${esc(m.kana)}" placeholder="まつだ たろう"></label>
    <label class="f">分類<select id="fCat">${opt(CATEGORIES,catOf(m))}</select></label>
    <label class="f" id="fGradeWrap" hidden>学年<select id="fGrade"></select></label>
    <div class="two"><label class="f">年齢<input id="fAge" type="number" min="1" max="99" inputmode="numeric" value="${esc(ageOf(m))}"></label><label class="f">階級<select id="fCls">${opt(CLASSES,m.weightClass)}</select></label></div>
    ${admin?`<label class="f">出身地 <small>任意</small><input id="fHome" maxlength="40" value="${esc(m.hometown)}"></label>
    <label class="f">戦績 <small>例：5勝(3KO)2敗1分</small><input id="fRec" maxlength="60" value="${esc(m.record)}"></label>
    <label class="f">ランキング <small>例：日本バンタム級 8位</small><input id="fRank" maxlength="60" value="${esc(m.ranking)}"></label>
    <label class="f">その他のランキング・タイトル <small>任意</small><input id="fRankD" maxlength="200" value="${esc(m.rankingDetail)}"></label>`:""}
    ${admin?`<label class="f">メモ <small>任意</small><textarea id="fNote" maxlength="300">${esc(m.note)}</textarea></label>`:""}
    <div class="err" id="fErr"></div>
    <div class="row"><button class="btn" data-act="close">やめる</button><span class="grow"></span><button class="btn primary" id="fSave">${mode==="register"?"送信する":"保存"}</button></div>`);
  let photo = m.photo || "";
  const syncGrade = ()=>{ const n = GRADES[$("#fCat").value]; $("#fGradeWrap").hidden = !n;
    if(n){ const cur = $("#fGrade").value || String(m.grade||""); $("#fGrade").innerHTML = `<option value="">選んでください</option>`+Array.from({length:n},(_,i)=>`<option value="${i+1}" ${String(i+1)===cur?"selected":""}>${i+1}年生</option>`).join(""); } };
  $("#fCat").addEventListener("change", syncGrade); syncGrade();
  $("#fPhoto").addEventListener("change", async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ photo = await shrinkPhoto(f); $("#pv").innerHTML = `<img class="avatar" src="${photo}" alt="">`; }catch(err){ $("#fErr").textContent = err.message; }
  });
  $("#rmPhoto")?.addEventListener("click", ()=>{ photo=""; $("#pv").innerHTML = avatar({sei:$("#fSei").value}); });
  $("#fSave").addEventListener("click", async ()=>{
    const data = { sei:$("#fSei").value.trim(), mei:$("#fMei").value.trim(), kana:$("#fKana").value.trim(),
      category:$("#fCat").value, weightClass:$("#fCls").value };
    if(!data.sei){ $("#fErr").textContent="名前を入力してください"; return; }
    if(!data.category){ $("#fErr").textContent="分類を選んでください"; return; }
    if(GRADES[data.category]){ if(!$("#fGrade").value){ $("#fErr").textContent="学年を選んでください"; return; } data.grade = Number($("#fGrade").value); }
    const ageV = $("#fAge").value; if(ageV){ const n = Number(ageV); if(!(n>=1 && n<=99)){ $("#fErr").textContent="年齢は数字で入れてください"; return; } data.age = Math.round(n); }
    if(mode==="register" && !photo){ $("#fErr").textContent="顔写真を選んでください"; return; }
    if(photo) data.photo = photo;
    const btn = $("#fSave"); btn.disabled = true; btn.textContent = "送信中…";
    try{
      if(mode==="register"){
        await addDoc(collection(db,"pending"), {...data, submittedAt: serverTimestamp()});
        openSheet(`<h3>送信しました</h3><p>管理者が確認したあと、所属者の一覧に載ります。</p><div class="row"><span class="grow"></span><button class="btn primary" data-act="close">閉じる</button></div>`);
        return;
      }
      data.record = $("#fRec").value.trim(); data.ranking = $("#fRank").value.trim(); data.note = $("#fNote").value.trim();
      data.hometown = $("#fHome").value.trim(); data.rankingDetail = $("#fRankD").value.trim();
      if(!GRADES[data.category]) data.grade = "";
      if(!ageV) data.age = "";
      if(m.birthDate && String(ageOf(m)) !== ageV) data.birthDate = "";
      if(!photo) data.photo = "";
      if(mode==="new") await addDoc(collection(db,"members"), {...data, createdAt: serverTimestamp()});
      else await updateDoc(doc(db,"members",m.id), data);
      closeSheet(); toast("保存しました");
    }catch(e){ $("#fErr").textContent = errMsg(e); btn.disabled=false; btn.textContent = mode==="register"?"送信する":"保存"; }
  });
}

  $("#lGo").addEventListener("click", async ()=>{
    try{ await signInWithEmailAndPassword(auth, $("#lEmail").value.trim(), $("#lPass").value); closeSheet(); toast("ログインしました"); }
    catch(e){ $("#lErr").textContent = errMsg(e); }
  });
}

function confirmSheet(msg, okLabel, fn){
  openSheet(`<h3>${esc(msg)}</h3><div class="err" id="cErr"></div><div class="row"><button class="btn" data-act="close">やめる</button><span class="grow"></span><button class="btn primary" id="cOk">${esc(okLabel)}</button></div>`);
  $("#cOk").addEventListener("click", async ()=>{ try{ await fn(); closeSheet(); }catch(e){ $("#cErr").textContent = errMsg(e); } });
}

/* ---------- actions ---------- */
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-tab],[data-act]"); if(!t) return;
  if(t.dataset.tab){ state.tab = t.dataset.tab; render(); window.scrollTo(0,0); return; }
  const act = t.dataset.act, id = t.dataset.id, i = t.dataset.i!=null ? Number(t.dataset.i) : null;
  const find = (arr)=>arr.find(x=>x.id===id);
  switch(act){
    case "close": closeSheet(); break;
    case "register": memberForm({}, "register"); break;
    case "filter": state.memberFilter = t.dataset.cat; render(); break;
    case "member-new": memberForm({}, "new"); break;
    case "member-edit": memberForm(find(state.members), "edit"); break;
    case "member-del": { const m=find(state.members); confirmSheet(`${m.sei} ${m.mei||""}さんを削除しますか？`, "削除", ()=>deleteDoc(doc(db,"members",id)).then(()=>toast("削除しました"))); break; }
    case "event-new": eventForm({}); break;
    case "event-edit": eventForm(find(state.events)); break;
    case "event-del": confirmSheet("この試合を削除しますか？", "削除", ()=>deleteDoc(doc(db,"events",id)).then(()=>toast("削除しました"))); break;
    case "manual-new": manualForm(null); break;
    case "manual-edit": manualForm(i); break;
    case "manual-del": { const secs=(state.manual||DEFAULT_MANUAL).slice(); confirmSheet(`「${secs[i].title}」を削除しますか？`, "削除", ()=>{ secs.splice(i,1); return saveManual(secs); }); break; }
    case "manual-up": { const secs=(state.manual||DEFAULT_MANUAL).slice(); [secs[i-1],secs[i]]=[secs[i],secs[i-1]]; saveManual(secs).catch(err=>toast(errMsg(err))); break; }
    case "ranking-edit": rankingForm(); break;
    case "seed-events": {
      const left = seedEventsLeft(); if(!left.length) break;
      t.disabled = true; t.textContent = "取り込み中…";
      const b = writeBatch(db);
      left.forEach(s => { const e = findEvent(s);
        if(e) b.update(doc(db,"events",e.id), {...s, assignments: e.assignments?.length ? e.assignments : s.assignments, seedVer:EVENT_SEED_VER});
        else b.set(doc(collection(db,"events")), {...s, seedVer:EVENT_SEED_VER}); });
      try{ await b.commit(); toast(`${left.length}件の試合を登録しました`); }catch(err){ t.disabled=false; t.textContent="取り込む"; toast(errMsg(err)); }
      break;
    }
    case "seed-import": {
      const left = seedLeft(); if(!left.length) break;
      t.disabled = true; t.textContent = "取り込み中…";
      const b = writeBatch(db);
      left.forEach(s => { const m = findMember(s);
        if(m) b.update(doc(db,"members",m.id), {...s, seedVer:SEED_VER});
        else b.set(doc(collection(db,"members")), {...s, photo:"", seedVer:SEED_VER, createdAt: serverTimestamp()}); });
      b.set(doc(db,"meta","ranking"), {updated:"2026-10-28", note:"JBC 2026年10月度ランキング（10月28日発表）。世界・東洋太平洋・WBO-APはボクシングモバイル掲載の最新順位（2026年11月22日確認）。"});
      try{ await b.commit(); toast(`${left.length}人を登録・更新しました`); }catch(err){ t.disabled=false; t.textContent="取り込む"; toast(errMsg(err)); }
      break;
    }
    case "pending-approve": {
      const p = find(state.pending); if(!p) break;
      t.disabled = true;
      const { id:_, submittedAt, ...data } = p;
      const b = writeBatch(db);
      b.set(doc(collection(db,"members")), {...data, record:"", ranking:"", createdAt: serverTimestamp()});
      b.delete(doc(db,"pending",p.id));
      try{ await b.commit(); toast(`${p.sei}さんを登録しました`); }catch(err){ t.disabled=false; toast(errMsg(err)); }
      break;
    }
    case "pending-reject": { const p=find(state.pending); confirmSheet(`${p.sei}さんの申請を却下しますか？`, "却下", ()=>deleteDoc(doc(db,"pending",id))); break; }
  }
});
$("#fab").addEventListener("click", e=>{ /* handled by data-act */ });
$("#adminBtn").addEventListener("click", ()=>{
  if(state.isAdmin) confirmSheet("ログアウトしますか？", "ログアウト", ()=>signOut(auth));
  else loginForm();
});
render();
</script>
</body>
