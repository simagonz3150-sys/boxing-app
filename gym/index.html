.list{display:flex;flex-direction:column;gap:10px}

footer button{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}

.loading{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
</style>

function errMsg(e){

  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "メールアドレスかパスワードが違います。";

}
function sortMembers(a,b){
  const ca=CATEGORIES.indexOf(catOf(a)), cb=CATEGORIES.indexOf(catOf(b));
  if(ca!==cb) return (ca<0?99:ca)-(cb<0?99:cb);
  if((b.grade||0)!==(a.grade||0)) return (b.grade||0)-(a.grade||0);
  const wa=CLASSES.indexOf(a.weightClass), wb=CLASSES.indexOf(b.weightClass);
  if(wa!==wb) return (wa<0?99:wa)-(wb<0?99:wb);
  return (a.kana||a.sei||"").localeCompare(b.kana||b.sei||"","ja");
}

/* resize a photo to a small JPEG data URL so it fits in Firestore */
function shrinkPhoto(file, max=480, quality=0.78){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const w = Math.round(img.width*s), h = Math.round(img.height*s);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q = quality, out = c.toDataURL("image/jpeg", q);
      while(out.length > 250000 && q > 0.4){ q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("写真を読み込めませんでした")); };
    img.src = url;
  });
}

  $("#adminBadge").hidden = !state.isAdmin;

  $("#mgrBtn").hidden = state.isAdmin || state.access!=="ok";

  if(false) h += `<div class="card" style="margin-bottom:12px"><b>ボクシングモバイルの選手を取り込む</b><div class="sub">松田ジム所属のプロ${seedLeft().length}人（${esc(seedLeft().map(s=>s.sei).join("・"))}）を、階級・生年月日・戦績・ランキング付きで登録します。登録済みの選手は最新の内容に更新します（顔写真はそのまま）。</div><div class="admin-actions"><button class="btn primary sm" data-act="seed-import">取り込む</button></div></div>`;

function boutsHtml(text){

function manualImg(id){
  if(state.imgs[id]===undefined){ state.imgs[id]=null; getDoc(doc(db,"meta","img_"+id)).then(d=>{ state.imgs[id] = d.exists()? d.data().data : ""; render(); }).catch(()=>{ state.imgs[id]=""; }); }
  const src = state.imgs[id];
  return `<div class="mimg">${src?`<img src="${esc(src)}" alt="">`:`<div class="ph">${src===""?"写真が見つかりません":"写真を読み込み中…"}</div>`}</div>`;
}
function manualBody(text){
  const lines = (text||"").replace(/\s+$/,"").split("\n");
  if(!lines.join("").trim()) return `<div class="none">（内容はまだありません）</div>`;
  return lines.map(l=>{
    const t = l.trim(); let m;
    if(!t) return `<div class="gap"></div>`;
    if((m = t.match(/^\[\[img:([A-Za-z0-9_-]+)\]\]$/))) return manualImg(m[1]);
    if(/^[・･]/.test(t)) return `<div class="li"><span>${esc(t.replace(/^[・･]\s*/,""))}</span></div>`;
    if(/^【.+】$/.test(t)) return `<div><span class="lbl">${esc(t)}</span></div>`;
    if(/^[●■◆]/.test(t)) return `<div class="hd">${esc(t.replace(/^[●■◆]\s*/,""))}</div>`;
    if(/^※/.test(t)) return `<div class="note2">${esc(t)}</div>`;
    if((m = t.match(/^(.+?)\s*［([^］]+)］$/))) return `<div class="tm"><span>${esc(m[1])}</span><b>${esc(m[2])}</b></div>`;
    return `<div class="p">${esc(t)}</div>`;
  }).join("");
}

function memberForm(m, mode){
  // mode: "register" (public), "new" / "edit" (admin)
  const admin = mode!=="register";
  const title = mode==="register" ? "所属者の登録" : mode==="new" ? "所属者を追加" : mode==="approve" ? "申請を編集して登録" : "所属者を編集";
  openSheet(`<h3>${title}</h3>
    ${mode==="register"?`<p class="note">送信した内容は、管理者が確認してから掲載されます。送信後は自分では変更できないので、直したいときは管理者に伝えてください。</p>`:""}
    <div class="photo-pick"><div id="pv">${avatar(m)}</div>
      <div><label class="btn" style="display:inline-block">顔写真を選ぶ<input type="file" id="fPhoto" accept="image/*" hidden></label>
      ${admin&&m.photo?`<div><button class="btn sm danger" id="rmPhoto" style="margin-top:6px">写真を外す</button></div>`:""}</div></div>
    <div class="two"><label class="f">名前（姓）<input id="fSei" maxlength="20" value="${esc(m.sei)}"></label><label class="f">名前（名）<input id="fMei" maxlength="20" value="${esc(m.mei)}"></label></div>
    <label class="f">ふりがな<input id="fKana" maxlength="40" value="${esc(m.kana)}" placeholder="まつだ たろう"></label>
    <label class="f">分類<select id="fCat">${opt(CATEGORIES,catOf(m))}</select></label>
    <label class="f" id="fGradeWrap" hidden>学年<select id="fGrade"></select></label>
    <div class="two"><label class="f">年齢<input id="fAge" type="number" min="1" max="99" inputmode="numeric" value="${esc(ageOf(m))}"></label><label class="f">階級<select id="fCls">${opt(CLASSES,m.weightClass)}</select></label></div>
    <div class="err" id="fErr"></div>
    <div class="row"><button class="btn" data-act="close">やめる</button><span class="grow"></span><button class="btn primary" id="fSave">${mode==="register"?"送信する":mode==="approve"?"登録する":"保存"}</button></div>`);
  let photo = m.photo || "";
  const syncGrade = ()=>{ const n = GRADES[$("#fCat").value]; $("#fGradeWrap").hidden = !n;
    if(n){ const cur = $("#fGrade").value || String(m.grade||""); $("#fGrade").innerHTML = `<option value="">選んでください</option>`+Array.from({length:n},(_,i)=>`<option value="${i+1}" ${String(i+1)===cur?"selected":""}>${i+1}年生</option>`).join(""); } };
  $("#fCat").addEventListener("change", syncGrade); syncGrade();
  $("#fPhoto").addEventListener("change", async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ photo = await shrinkPhoto(f); $("#pv").innerHTML = `<img class="avatar" src="${photo}" alt="">`; }catch(err){ $("#fErr").textContent = err.message; }
  });
  $("#rmPhoto")?.addEventListener("click", ()=>{ photo=""; $("#pv").innerHTML = avatar({sei:$("#fSei").value}); });
  $("#fSave").addEventListener("click", async ()=>{
    const data = { sei:$("#fSei").value.trim(), mei:$("#fMei").value.trim(), kana:$("#fKana").value.trim(),
      category:$("#fCat").value, weightClass:$("#fCls").value };
    if(!data.sei){ $("#fErr").textContent="名前を入力してください"; return; }
    if(!data.category){ $("#fErr").textContent="分類を選んでください"; return; }
    if(GRADES[data.category]){ if(!$("#fGrade").value){ $("#fErr").textContent="学年を選んでください"; return; } data.grade = Number($("#fGrade").value); }
    const ageV = $("#fAge").value; if(ageV){ const n = Number(ageV); if(!(n>=1 && n<=99)){ $("#fErr").textContent="年齢は数字で入れてください"; return; } data.age = Math.round(n); }
    if(mode==="register" && !photo){ $("#fErr").textContent="顔写真を選んでください"; return; }
    if(photo) data.photo = photo;
    const btn = $("#fSave"); btn.disabled = true; btn.textContent = "送信中…";
    try{
      if(mode==="register"){
        await addDoc(collection(db,"pending"), {...data, submittedAt: serverTimestamp()});
        openSheet(`<h3>送信しました</h3><p>管理者が確認したあと、所属者の一覧に載ります。</p><div class="row"><span class="grow"></span><button class="btn primary" data-act="close">閉じる</button></div>`);
        return;
      }
      if(!GRADES[data.category]) data.grade = "";
      if(!ageV) data.age = "";
      if(m.birthDate && String(ageOf(m)) !== ageV) data.birthDate = "";
      if(!photo) data.photo = "";
      if(mode==="approve"){
        const b = writeBatch(db);
        b.set(doc(collection(db,"members")), {...data, createdAt: serverTimestamp()});
        b.delete(doc(db,"pending",m.id));
        await b.commit(); closeSheet(); toast(`${data.sei}さんを登録しました`); return;
      }
      if(mode==="new") await addDoc(collection(db,"members"), {...data, createdAt: serverTimestamp()});
      else await updateDoc(doc(db,"members",m.id), data);
      closeSheet(); toast("保存しました");
    }catch(e){ $("#fErr").textContent = errMsg(e); btn.disabled=false; btn.textContent = mode==="register"?"送信する":"保存"; }
  });
}

  $("#eSave").addEventListener("click", async ()=>{
    const assignments = $("#eAssign").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const m = l.match(/^(.+?)[：:]\s*(.*)$/); return m ? {role:m[1].trim(), name:m[2].trim()} : {role:"担当", name:l};
    });
    const data = { date:$("#eDate").value, time:$("#eTime").value, title:$("#eTitle").value.trim(), venue:$("#eVenue").value.trim(),

function manualForm(i){
  const secs = (state.manual || DEFAULT_MANUAL).slice();
  const s = i==null ? {title:"",body:""} : secs[i];
  openSheet(`<h3>${i==null?"項目を追加":"項目を編集"}</h3>
    <label class="f">見出し<input id="mTitle" maxlength="60" value="${esc(s.title)}"></label>
    <label class="f">内容 <small>「・」で始まる行はチェック項目、【 】は見出しラベル、●は小見出し、※は注意書きとして表示されます</small><textarea id="mBody" style="min-height:220px">${esc(s.body)}</textarea></label>
    <div class="row" style="margin:-4px 0 12px"><label class="btn sm" style="display:inline-block">📷 カーソルの位置に写真を入れる<input type="file" id="mPhoto" accept="image/*" hidden></label><span class="sub" id="mPhotoMsg" style="margin:0"></span></div>
    <div class="err" id="mErr"></div>
    <div class="row"><button class="btn" data-act="close">やめる</button><span class="grow"></span><button class="btn primary" id="mSave">保存</button></div>`);
  let caret = null; const ta = $("#mBody");
  ["keyup","click","input","blur"].forEach(ev=>ta.addEventListener(ev, ()=>{ caret = ta.selectionStart; }));
  $("#mPhoto").addEventListener("change", async ev=>{
    const f = ev.target.files[0]; if(!f) return;
    $("#mPhotoMsg").textContent = "写真を保存中…";
    try{
      const data = await shrinkPhoto(f, 900, 0.8);
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      await setDoc(doc(db,"meta","img_"+id), {data});
      state.imgs[id] = data;
      const v = ta.value; let pos = caret==null ? v.length : caret;
      const eol = v.indexOf("\n", pos); pos = eol<0 ? v.length : eol;
      ta.value = v.slice(0,pos) + "\n[[img:"+id+"]]" + v.slice(pos);
      caret = pos + id.length + 9;
      $("#mPhotoMsg").textContent = "写真を入れました（[[img:…]] の行が写真になります）";
    }catch(err){ $("#mPhotoMsg").textContent = errMsg(err); }
    ev.target.value = "";
  });
  $("#mSave").addEventListener("click", async ()=>{
    const item = {title:$("#mTitle").value.trim(), body:$("#mBody").value};
    if(!item.title){ $("#mErr").textContent="見出しを入れてください"; return; }
    if(i==null) secs.push(item); else secs[i]=item;
    try{ await saveManual(secs); closeSheet(); toast("保存しました"); }catch(e){ $("#mErr").textContent=errMsg(e); }
  });
}

          <div class="row"><button class="btn" id="mcCopy">コピー</button><span class="grow"></span><button class="btn primary" data-act="close">閉じる</button></div>`);
        $("#mcCopy").addEventListener("click", ()=>{ navigator.clipboard?.writeText(fmtCode(code)).then(()=>toast("コピーしました"),()=>{}); });
      }catch(err){ toast(errMsg(err)); } break; }
    case "mcode-del": confirmSheet(`会長ID ${fmtCode(id)} を削除しますか？このIDを使っている人の権限がなくなります。`, "削除", async ()=>{ const b=writeBatch(db); b.delete(doc(db,"managerCodes",id)); state.managerDevices.filter(d=>d.code===id).forEach(d=>b.delete(doc(db,"managers",d.id))); await b.commit(); toast("削除しました"); }); break;
    case "vcode-del": confirmSheet(`合言葉「${id}」を削除しますか？`, "削除", async ()=>{ const b=writeBatch(db); b.delete(doc(db,"viewCodes",id)); state.viewerDevices.filter(d=>d.code===id).forEach(d=>b.delete(doc(db,"viewers",d.id))); await b.commit(); toast("削除しました"); }); break;
    case "open-tickets": state.ticketEventId=id; state.tab="tickets"; render(); window.scrollTo(0,0); break;
    case "ticket-new": ticketForm({}); break;
    case "ticket-edit": { const e=state.events.find(x=>x.id===state.ticketEventId); const tk=(e?.tickets||[]).find(x=>x.id===t.dataset.tid); if(tk) ticketForm(tk); break; }
    case "ticket-types": ticketTypesForm(); break;
    case "open-support": state.supportEventId=id; state.tab="support"; render(); window.scrollTo(0,0); break;
    case "back-events": state.tab="events"; render(); window.scrollTo(0,0); break;
    case "support-new": supportPicker(); break;
    case "roles-edit": rolesForm(); break;
    case "checks-edit": checksForm(); break;
    case "plan-edit": planForm(); break;
    case "check-toggle": { e.preventDefault(); if(!canEditSupport()) break; const evId=state.supportEventId; const key=t.dataset.key;
      const c = {...((state.checks||{})[evId]||{})}; if(c[key]) delete c[key]; else c[key]=true;
      const prev = (state.checks||{})[evId]; state.checks = {...(state.checks||{}), [evId]: c}; render();
      setDoc(doc(db,"support","chk_"+evId), {eventId:"_chk", c}).catch(err=>{ state.checks[evId]=prev; render(); toast(leaderErr(err)); }); break; }
    case "role-assign": roleAssignForm(t.dataset.key, t.dataset.role); break;
    case "role-toggle": { const sm=find(state.support); if(!sm) break; const r=t.dataset.role; const cur=sm.roles||[];
      const next = cur.includes(r) ? cur.filter(x=>x!==r) : [...cur, r];
      sm.roles = next; render();
      updateDoc(doc(db,"support",id), {roles: next}).catch(err=>{ sm.roles = cur; render(); toast(leaderErr(err)); }); break; }
    case "support-del": { const sm=find(state.support); const m=memberOf(sm); confirmSheet(`${m?m.sei+" "+(m.mei||""):sm.name}さんをサポートメンバーから外しますか？`, "外す", ()=>deleteDoc(doc(db,"support",id)).then(()=>toast("外しました"))); break; }
    case "code-new": codeForm(); break;
    case "code-del": confirmSheet(`リーダーID ${fmtCode(id)} を削除しますか？このIDを使っている人は操作できなくなります。`, "削除", async ()=>{
      const b = writeBatch(db); b.delete(doc(db,"leaderCodes",id)); state.leaderDevices.filter(d=>d.code===id).forEach(d=>b.delete(doc(db,"leaders",d.id))); await b.commit(); toast("削除しました"); }); break;
    case "leader-enter": leaderEnterForm(); break;
    case "leader-quit": confirmSheet("このスマホのリーダーをやめますか？", "リーダーをやめる", async ()=>{ try{ await deleteDoc(doc(db,"leaders",auth.currentUser.uid)); }catch(e){} state.isLeader=false; toast("リーダーをやめました"); render(); }); break;
    case "register": memberForm({}, "register"); break;
    case "filter": state.memberFilter = t.dataset.cat; render(); break;
    case "member-new": memberForm({}, "new"); break;
    case "member-edit": memberForm(find(state.members), "edit"); break;
    case "member-del": { const m=find(state.members); confirmSheet(`${m.sei} ${m.mei||""}さんを削除しますか？`, "削除", ()=>deleteDoc(doc(db,"members",id)).then(()=>toast("削除しました"))); break; }
    case "event-new": eventForm({}); break;
    case "event-edit": eventForm(find(state.events)); break;
    case "event-del": confirmSheet("この試合を削除しますか？チケット購入者などの記録も見られなくなります。", "削除", ()=>deleteDoc(doc(db,"events",id)).then(()=>toast("削除しました"))); break;
    case "manual-new": manualForm(null); break;
    case "mjump": { e.preventDefault(); document.getElementById("msec"+t.dataset.i)?.scrollIntoView({behavior:"smooth"}); break; }
    case "manual-edit": manualForm(i); break;
    case "manual-del": { const secs=(state.manual||DEFAULT_MANUAL).slice(); confirmSheet(`「${secs[i].title}」を削除しますか？`, "削除", ()=>{ secs.splice(i,1); return saveManual(secs); }); break; }
    case "manual-up": { const secs=(state.manual||DEFAULT_MANUAL).slice(); [secs[i-1],secs[i]]=[secs[i],secs[i-1]]; saveManual(secs).catch(err=>toast(errMsg(err))); break; }
    case "ranking-edit": rankingForm(); break;
    case "seed-events": {
      const left = seedEventsLeft(); if(!left.length) break;
      t.disabled = true; t.textContent = "取り込み中…";
      const b = writeBatch(db);
      left.forEach(s => { const e = findEvent(s);
        if(e) b.update(doc(db,"events",e.id), {...s, assignments: e.assignments?.length ? e.assignments : s.assignments, seedVer:EVENT_SEED_VER});
        else b.set(doc(collection(db,"events")), {...s, seedVer:EVENT_SEED_VER}); });
      try{ await b.commit(); toast(`${left.length}件の試合を登録しました`); }catch(err){ t.disabled=false; t.textContent="取り込む"; toast(errMsg(err)); }
      break;
    }
    case "seed-import": {
      const left = seedLeft(); if(!left.length) break;
      t.disabled = true; t.textContent = "取り込み中…";
      const b = writeBatch(db);
      left.forEach(s => { const m = findMember(s);
        if(m) b.update(doc(db,"members",m.id), {...s, seedVer:SEED_VER});
        else b.set(doc(collection(db,"members")), {...s, photo:"", seedVer:SEED_VER, createdAt: serverTimestamp()}); });
      b.set(doc(db,"meta","ranking"), {updated:"2026-10-28", note:"JBC 2026年10月度ランキング（10月28日発表）。世界・東洋太平洋・WBO-APはボクシングモバイル掲載の最新順位（2026年11月22日確認）。"});
      try{ await b.commit(); toast(`${left.length}人を登録・更新しました`); }catch(err){ t.disabled=false; t.textContent="取り込む"; toast(errMsg(err)); }
      break;
    }
    case "pending-approve": {
      const p = find(state.pending); if(!p) break;
      t.disabled = true;
      const { id:_, submittedAt, ...data } = p;
      const b = writeBatch(db);
      b.set(doc(collection(db,"members")), {...data, record:"", ranking:"", createdAt: serverTimestamp()});
      b.delete(doc(db,"pending",p.id));
      try{ await b.commit(); toast(`${p.sei}さんを登録しました`); }catch(err){ t.disabled=false; toast(errMsg(err)); }
      break;
    }
    case "pending-edit": memberForm(find(state.pending), "approve"); break;
    case "pending-reject": { const p=find(state.pending); confirmSheet(`${p.sei}さんの申請を却下しますか？`, "却下", ()=>deleteDoc(doc(db,"pending",id))); break; }
  }
});
$("#fab").addEventListener("click", e=>{ /* handled by data-act */ });
$("#adminBtn").addEventListener("click", ()=>{
  if(state.isOwner) confirmSheet("ログアウトしますか？", "ログアウト", ()=>signOut(auth));
  else if(state.isManager) confirmSheet("このスマホの会長の権限をやめますか？", "やめる", async ()=>{ try{ await deleteDoc(doc(db,"managers",auth.currentUser.uid)); }catch(e){} state.isManager=false; state.isAdmin=false; toast("会長の権限をやめました"); location.reload(); });
  else loginForm();
});
$("#mgrBtn").addEventListener("click", ()=>{
  openSheet(`<h3>会長IDを入力</h3><p class="note">管理者から受け取った会長IDを入れると、このスマホで所属者の編集や申請の承認などができるようになります。一度入れれば次からは入力不要です。</p>
    <label class="f">会長ID<input id="mgCode" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX" style="letter-spacing:.1em;font-family:ui-monospace,Menlo,monospace"></label>
    <div class="err" id="mgErr"></div>
    <div class="row"><button class="btn" data-act="close">やめる</button><span class="grow"></span><button class="btn primary" id="mgGo">決定</button></div>`);
  $("#mgGo").addEventListener("click", async ()=>{
    const code = $("#mgCode").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(code.length!==8){ $("#mgErr").textContent="IDは8文字です"; return; }
    $("#mgGo").disabled = true;
    try{ if(!auth.currentUser) await signInAnonymously(auth);
      await setDoc(doc(db,"managers",auth.currentUser.uid), {code, at: serverTimestamp()});
      toast("会長の権限が付きました"); setTimeout(()=>location.reload(), 600); }
    catch(e){ $("#mgGo").disabled=false; $("#mgErr").textContent = (e?.code||"").includes("permission") ? "IDが違うか、使えなくなっています。" : errMsg(e); }
  });
});
render();
</script>
</body>
</html>
