<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サポーター管理</title>
<style>
  :root{
    --bg:#f4f2ee; --card:#fff; --ink:#1c1c1e; --sub:#6e6e73; --line:#e3e0da;
    --accent:#c8102e; --accent-soft:#fbe9ec;
    --st0:#8e8e93; --st0b:#efeff1;
    --st1:#2563eb; --st1b:#e6eefe;
    --st2:#b45309; --st2b:#fdf1dc;
    --st3:#15803d; --st3b:#e3f5e8;
    --st4:#ffffff; --st4b:#15803d;
    --st5:#a1a1a6; --st5b:#f4f4f5;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:14px 16px 12px;
    padding-top:calc(14px + env(safe-area-inset-top))}
  header h1{margin:0;font-size:17px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  header h1 .bar{width:4px;height:18px;background:var(--accent);border-radius:2px}
  .demo{font-size:11px;background:var(--accent);padding:2px 8px;border-radius:99px;margin-left:auto;font-weight:500}
  main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

  /* tab bar */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:11px;color:var(--sub)}
  nav button .ic{font-size:20px;line-height:1}
  nav button.on{color:var(--accent);font-weight:600}

  /* common */
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
  .muted{color:var(--sub);font-size:13px}
  .search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:16px;outline:none}
  .search:focus{border-color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip b{font-weight:600;margin-left:4px}
  .list{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;margin-top:8px}
  .row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:0}
  .row:active{background:#faf9f7}
  .row-main{flex:1;min-width:0}
  .nm{font-weight:600;font-size:15px}
  .nm .hon{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
  .meta{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .tag{background:var(--bg);border-radius:6px;padding:1px 7px;font-size:11px;color:#48484a}
  .pill{flex:none;border:0;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:600;min-width:64px}
  .s0{color:var(--st0);background:var(--st0b)} .s1{color:var(--st1);background:var(--st1b)}
  .s2{color:var(--st2);background:var(--st2b)} .s3{color:var(--st3);background:var(--st3b)}
  .s4{color:var(--st4);background:var(--st4b)} .s5{color:var(--st5);background:var(--st5b);text-decoration:line-through}
  .empty{text-align:center;padding:48px 16px;color:var(--sub)}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--ink);color:#fff;width:100%}
  .btn.ghost{background:var(--bg);color:var(--ink)}
  .btn.danger{background:var(--accent-soft);color:var(--accent)}
  .btn.danger.armed{background:var(--accent);color:#fff}
  .fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:50%;
    border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(200,16,46,.35)}

  /* event picker + summary */
  .evsel{width:100%;border:0;background:transparent;font-size:17px;font-weight:700;padding:0;appearance:none;-webkit-appearance:none}
  .evhead{display:flex;align-items:center;gap:8px}
  .evhead .caret{color:var(--sub)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--bg);border-radius:10px;padding:10px}
  .stat .k{font-size:11px;color:var(--sub)}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat.hl{background:var(--ink);color:#fff}.stat.hl .k{color:#c7c7cc}
  .groups{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .groups span{font-size:12px;background:var(--bg);border-radius:6px;padding:3px 8px}

  /* bottom sheet */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .ov.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
    padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:4px auto 12px}
  .sheet h2{margin:0 0 4px;font-size:19px}
  .sec{margin-top:16px}
  .sec>label,.fl{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-size:13px;font-weight:600;text-align:center}
  .opt small{display:block;font-weight:400;color:var(--sub);font-size:11px}
  .opt:disabled{opacity:.3}
  .opt.on{border-color:var(--ink);background:var(--ink);color:#fff}.opt.on small{color:#c7c7cc}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px}
  .stepper .n{font-size:22px;font-weight:700;min-width:32px;text-align:center}
  .inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;outline:none}
  .inp:focus{border-color:var(--ink)}
  textarea.inp{min-height:70px;resize:vertical}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .two>*{min-width:0}
  input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;
    min-height:44px;text-align:left;line-height:1.3}
  input[type=date].inp::-webkit-date-and-time-value{text-align:left}
  .f{margin-top:12px}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding:12px;background:var(--bg);border-radius:10px}
  .total b{font-size:20px}
  .actions{display:grid;gap:8px;margin-top:18px}
  .links{display:flex;gap:8px;margin-top:8px}
  .links a{font-size:13px;color:var(--st1);text-decoration:none;background:var(--st1b);padding:5px 10px;border-radius:8px}
  .hist{font-size:13px;margin-top:6px}
  .hist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}

  .toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .loading{text-align:center;padding:60px 0;color:var(--sub)}
</style>
</head>
<body>
<header><h1><span class="bar"></span>サポーター管理<span id="demo"></span></h1></header>
<main id="main"><div class="loading">読み込み中…</div></main>
<nav id="nav">
  <button data-tab="tickets" class="on"><span class="ic">🎫</span>チケット</button>
  <button data-tab="customers"><span class="ic">👥</span>顧客</button>
  <button data-tab="events"><span class="ic">🥊</span>試合</button>
</nav>
<div id="fab"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========= API（Google上ではスプレッドシート、プレビューでは架空データ） ========= */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const api = (fn, ...a) => IS_GAS
  ? new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...a))
  : new Promise(ok => setTimeout(() => ok(Demo[fn](...a.map(x => JSON.parse(JSON.stringify(x))))), 80));
const getAll = keys => api('getAll', keys);
const batch = ops => api('batch', ops);
const STATUSES = ['未案内','案内済','確認中','決定','入金済','見送り'];
const DEFAULT_SEATS = [{ name:'リングサイド', price:10000 }, { name:'指定席', price:6000 }, { name:'自由席', price:4000 }];

/* プレビュー用：サーバーの getAll / batch と同じ動きをする架空データ */
const Demo = (() => {
  const id = () => Math.random().toString(36).slice(2, 14);
  const g = ['部活_同期', '部活_先輩', 'ジム_先輩', 'ジム_後輩', '高校_友達', '家族', '後援会', '仕事関係'];
  const names = [
    ['山田 太郎','やまだ たろう',0],['佐藤 健一','さとう けんいち',0],['鈴木 大輔','すずき だいすけ',1],
    ['高橋 翔','たかはし しょう',2],['田中 誠','たなか まこと',3],['伊藤 拓海','いとう たくみ',4],
    ['渡辺 美咲','わたなべ みさき',4],['中村 隆','なかむら たかし',5],['小林 修','こばやし おさむ',6],
    ['加藤 浩二','かとう こうじ',6],['吉田 直樹','よしだ なおき',7],['山口 亮','やまぐち りょう',0],
  ];
  const price = { 'リングサイド':10000, '指定席':6000, '自由席':4000 };
  const db = {
    customers: names.map(([n,k,gi], i) => ({ id:'c'+i, name:n, kana:k, honorific: gi===5?'':'様', group:g[gi],
      phone:'090-0000-00'+String(i).padStart(2,'0'), email:'', zip:'4600000', addr1:'愛知県名古屋市〇〇区', addr2:i+'-1-1 サンプル荘101',
      company: gi===7?'株式会社サンプル':'', memo:'' })),
    events: [
      { id:'e1', title:'12月 ライト級8回戦', date:'2026-12-20', venue:'〇〇ホール', memo:'' },
      { id:'e0', title:'8月 ライト級6回戦', date:'2026-08-09', venue:'〇〇ホール', memo:'' },
    ],
    tickets: [],
    seats: Object.entries(price).map(([name, p], i) => ({ id:'s'+i, name, price:String(p) })),
  };
  const seed = [['c0','決定','指定席',2],['c1','入金済','リングサイド',1],['c2','確認中'],['c3','入金済','指定席',4],
    ['c4','案内済'],['c5','決定','自由席',3],['c7','入金済','リングサイド',2],['c8','確認中'],['c9','決定','指定席',5],['c10','見送り']];
  seed.forEach(([c,s,seat='',q=0]) => db.tickets.push({ id:id(), eventId:'e1', customerId:c, status:s, seat, qty:String(q), price: seat?String(price[seat]):'', memo:'' }));
  ['c0','c1','c3','c7','c9'].forEach(c => db.tickets.push({ id:id(), eventId:'e0', customerId:c, status:'入金済', seat:'指定席', qty:'2', price:'6000', memo:'' }));
  const tbl = k => (db[k] = db[k] || []);
  const copy = x => JSON.parse(JSON.stringify(x));
  return {
    getAll: keys => { const o = {}; keys.forEach(k => o[k] = copy(tbl(k))); return o; },
    batch: ops => ops.map(o => {
      const t = tbl(o.key);
      if (o.op === 'upsert') { const x = { ...o.obj, id: o.obj.id || id() }; const i = t.findIndex(r => r.id === x.id); i < 0 ? t.push(x) : (t[i] = { ...t[i], ...x }); return copy(x); }
      if (o.op === 'remove') { db[o.key] = t.filter(r => r.id !== o.id); return o.id; }
      if (o.op === 'removeWhere') { db[o.key] = t.filter(r => String(r[o.field]) !== String(o.value)); return 0; }
      if (o.op === 'replaceAll') { db[o.key] = o.list.map(r => ({ ...r, id: r.id || id() })); return copy(db[o.key]); }
      if (o.op === 'replaceValue') { t.forEach(r => { if (String(r[o.field]) === String(o.from)) r[o.field] = o.to; }); return 0; }
    }),
  };
})();

/* ========= 状態 ========= */
const S = { customers:[], events:[], tickets:[], seats:[], statuses:[],
  tab:'tickets', eventId:null, tq:'', tfilter:'all', cq:'', cgroup:'all' };
const CYCLE = ['未案内','案内済','確認中','決定','入金済'];

/* ========= ユーティリティ ========= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v) || 0;
const yen = n => '¥' + num(n).toLocaleString('ja-JP');
const sIdx = s => Math.max(0, S.statuses.indexOf(s));
const isSold = s => s === '決定' || s === '入金済';
const byKana = (a, b) => (a.kana || a.name).localeCompare(b.kana || b.name, 'ja');
const groups = () => [...new Set(S.customers.map(c => c.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
// 試合の席種：その試合専用 → なければ共通（試合IDなし）→ なければ初期値
function seatsFor(eventId){
  const sort = arr => arr.sort((a, b) => a.order - b.order);
  const own = sort(S.seats.filter(x => eventId && x.eventId === eventId));
  if (own.length) return own;
  const common = sort(S.seats.filter(x => !x.eventId));
  return common.length ? common : DEFAULT_SEATS.map((x, i) => ({ ...x, order: i }));
}
const fmtDate = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${y}/${+m}/${+dd}`; };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
function replaceLocal(k, o){ const i = S[k].findIndex(x => x.id === o.id); i < 0 ? S[k].push(o) : (S[k][i] = o); }
function fail(e){ toast('保存に失敗しました：' + (e && e.message || e)); load(); }

/* ========= 読み込み ========= */
async function load(){
  try {
    const d = await getAll(['customers', 'events', 'tickets', 'seats']);
    Object.assign(S, { customers: d.customers, events: d.events, tickets: d.tickets, statuses: STATUSES,
      seats: d.seats.map(x => ({ ...x, price: num(x.price), order: num(x.order) })) });
    if (!S.events.find(e => e.id === S.eventId)) S.eventId = defaultEvent();
    render();
  } catch (e) { $('#main').innerHTML = `<div class="empty">読み込みに失敗しました<br><small>${esc(e.message||e)}</small></div>`; }
}
function defaultEvent(){
  if (!S.events.length) return null;
  const today = new Date().toISOString().slice(0,10);
  const up = S.events.filter(e => e.date >= today).sort((a,b) => a.date.localeCompare(b.date));
  return (up[0] || [...S.events].sort((a,b) => b.date.localeCompare(a.date))[0]).id;
}

/* ========= 描画 ========= */
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#demo').outerHTML = IS_GAS ? '<span id="demo"></span>' : '<span id="demo" class="demo">プレビュー（架空データ）</span>';
  const v = { tickets: viewTickets, customers: viewCustomers, events: viewEvents }[S.tab];
  $('#main').innerHTML = v();
  $('#fab').innerHTML = S.tab === 'customers' ? '<button class="fab" onclick="openCustomer()">＋</button>'
                      : S.tab === 'events'    ? '<button class="fab" onclick="openEvent()">＋</button>' : '';
  if (S.tab === 'tickets') renderTicketList();
  if (S.tab === 'customers') renderCustList();
}

/* ---- チケット ---- */
function ticketRows(){
  const tm = new Map(S.tickets.filter(t => t.eventId === S.eventId).map(t => [t.customerId, t]));
  return S.customers.slice().sort(byKana).map(c => { const t = tm.get(c.id); return { c, t, st: t && t.status || '未案内' }; });
}
function viewTickets(){
  if (!S.events.length) return `<div class="empty">まだ試合が登録されていません<br><br>
    <button class="btn" style="width:auto" onclick="S.tab='events';render();openEvent()">試合を追加する</button></div>`;
  const rows = ticketRows();
  const sold = rows.filter(r => isSold(r.st));
  const qty = sold.reduce((s,r) => s + num(r.t.qty), 0);
  const amt = sold.reduce((s,r) => s + num(r.t.qty) * num(r.t.price), 0);
  const paid = rows.filter(r => r.st === '入金済').reduce((s,r) => s + num(r.t.qty) * num(r.t.price), 0);
  const cnt = {}; S.statuses.forEach(s => cnt[s] = 0); rows.forEach(r => cnt[r.st]++);
  const gsum = {}; sold.forEach(r => { const k = r.c.group || '未分類'; gsum[k] = (gsum[k]||0) + num(r.t.qty); });
  const opts = [...S.events].sort((a,b) => b.date.localeCompare(a.date))
    .map(e => `<option value="${esc(e.id)}" ${e.id===S.eventId?'selected':''}>${esc(e.title)}（${fmtDate(e.date)}）</option>`).join('');
  return `
  <div class="card">
    <div class="evhead"><select class="evsel" onchange="S.eventId=this.value;render()">${opts}</select><span class="caret">▾</span></div>
    <div class="stats">
      <div class="stat hl"><div class="k">確定枚数</div><div class="v">${qty}枚</div></div>
      <div class="stat"><div class="k">売上見込み</div><div class="v">${yen(amt)}</div></div>
      <div class="stat"><div class="k">未入金</div><div class="v" style="color:${amt-paid?'var(--accent)':'inherit'}">${yen(amt-paid)}</div></div>
    </div>
    ${Object.keys(gsum).length ? `<div class="groups">${Object.entries(gsum).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<span>${esc(k)} <b>${v}</b></span>`).join('')}</div>` : ''}
  </div>
  <input class="search" placeholder="名前・関係性で検索" value="${esc(S.tq)}" oninput="S.tq=this.value;renderTicketList()">
  <div class="chips">
    <button class="chip ${S.tfilter==='all'?'on':''}" onclick="S.tfilter='all';render()">すべて<b>${rows.length}</b></button>
    ${S.statuses.map(s => `<button class="chip ${S.tfilter===s?'on':''}" onclick="S.tfilter='${s}';render()">${s}<b>${cnt[s]}</b></button>`).join('')}
  </div>
  <div id="tlist"></div>`;
}
function renderTicketList(){
  const q = S.tq.trim().toLowerCase();
  const rows = ticketRows().filter(r => (S.tfilter === 'all' || r.st === S.tfilter) &&
    (!q || [r.c.name, r.c.kana, r.c.group, r.c.company].join(' ').toLowerCase().includes(q)));
  $('#tlist').innerHTML = !rows.length ? '<div class="empty">該当する人はいません</div>' :
    `<div class="list">${rows.map(({c,t,st}) => `
      <div class="row" onclick="openTicket('${esc(c.id)}')">
        <div class="row-main">
          <div class="nm">${esc(c.name)}<span class="hon">${esc(c.honorific)}</span></div>
          <div class="meta">${c.group?`<span class="tag">${esc(c.group)}</span>`:''}
            ${t && num(t.qty) ? `<span>${esc(t.seat||'席未定')} × ${num(t.qty)}枚</span>` : ''}
            ${t && t.memo ? `<span>📝</span>` : ''}</div>
        </div>
        <button class="pill s${sIdx(st)}" onclick="event.stopPropagation();advance('${esc(c.id)}')">${esc(st)}</button>
      </div>`).join('')}</div>`;
}
function getTicket(cid){ return S.tickets.find(t => t.eventId === S.eventId && t.customerId === cid); }
function advance(cid){
  const cur = getTicket(cid) || { eventId:S.eventId, customerId:cid, status:'未案内', seat:'', qty:'0', price:'', memo:'' };
  const i = CYCLE.indexOf(cur.status);
  const next = CYCLE[(i + 1) % CYCLE.length];
  const t = { ...cur, status: next };
  if (isSold(next) && !num(t.qty)) {
    const ss = seatsFor(S.eventId); const s = ss[1] || ss[0];
    t.qty = '1';
    if (s) { t.seat = t.seat || s.name; t.price = t.price || String(s.price); }
  }
  commitTicket(t);
}
const ticketQueue = {};
function commitTicket(t){
  // 画面はすぐ更新し、保存は同じ人ごとに順番に送る（連打しても行が重複しないように）
  const key = t.eventId + '|' + t.customerId;
  const local = { ...t, id: t.id || ('tmp_' + Math.random()) };
  replaceLocal('tickets', local);
  if (S.tab === 'tickets') render();
  ticketQueue[key] = (ticketQueue[key] || Promise.resolve()).then(() => {
    const cur = S.tickets.find(x => x.eventId === t.eventId && x.customerId === t.customerId) || local;
    const body = { ...cur };
    if (String(body.id).startsWith('tmp_')) delete body.id;
    return batch([{ op:'upsert', key:'tickets', obj: body }]).then(([saved]) => {
      S.tickets = S.tickets.filter(x => !(x.eventId === t.eventId && x.customerId === t.customerId));
      S.tickets.push({ ...cur, id: saved.id });
      if (S.tab === 'tickets' && !$('#ov').classList.contains('open')) render();
    });
  }).catch(fail);
}
function openTicket(cid){
  const c = S.customers.find(x => x.id === cid);
  const t = getTicket(cid) || { eventId:S.eventId, customerId:cid, status:'未案内', seat:'', qty:'0', price:'', memo:'' };
  const ev = S.events.find(e => e.id === S.eventId);
  openSheet(`
    <h2>${esc(c.name)}<span class="muted" style="font-weight:400"> ${esc(c.honorific)}</span></h2>
    <div class="muted">${esc(ev.title)}・${esc(c.group||'')}</div>
    ${c.phone ? `<div class="links"><a href="tel:${esc(c.phone)}">📞 電話する</a><a href="sms:${esc(c.phone)}">💬 SMS</a></div>` : ''}
    <div class="sec"><label>状況</label>
      <div class="grid3" id="t_status">${S.statuses.map(s => `<button class="opt ${s===t.status?'on':''}" data-v="${s}" onclick="pick(this)">${s}</button>`).join('')}</div></div>
    <div class="sec"><label>席種</label>
      <div class="grid3" id="t_seat">${[...seatsFor(S.eventId), ...(t.seat && !seatsFor(S.eventId).some(s => s.name === t.seat) ? [{ name: t.seat, price: num(t.price) }] : [])].map(s => `<button class="opt ${s.name===t.seat?'on':''}" data-v="${esc(s.name)}" data-p="${s.price}" onclick="pick(this);$('#t_price').value=this.dataset.p;calc()">${esc(s.name)}<small>${yen(s.price)}</small></button>`).join('')}</div></div>
    <div class="sec two">
      <div><label class="fl">枚数</label><div class="stepper">
        <button onclick="step(-1)">−</button><span class="n" id="t_qty">${num(t.qty)}</span><button onclick="step(1)">＋</button></div></div>
      <div><label class="fl">単価</label><input class="inp" id="t_price" inputmode="numeric" value="${esc(t.price)}" oninput="calc()"></div>
    </div>
    <div class="f"><label class="fl">メモ</label><textarea class="inp" id="t_memo" placeholder="例：2人で来場、当日受け取り">${esc(t.memo)}</textarea></div>
    <div class="total"><span class="muted">合計</span><b id="t_total"></b></div>
    <div class="actions">
      <button class="btn" onclick="saveTicketSheet('${esc(cid)}')">保存</button>
      <button class="btn ghost" onclick="closeSheet();S.tab='customers';render();openCustomer('${esc(cid)}')">顧客情報を見る</button>
    </div>`);
  calc();
}
function pick(el){ el.parentNode.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b === el)); }
function step(d){ const n = $('#t_qty'); n.textContent = Math.max(0, num(n.textContent) + d); calc(); }
function calc(){ $('#t_total').textContent = yen(num($('#t_qty').textContent) * num($('#t_price').value)); }
function saveTicketSheet(cid){
  const old = getTicket(cid) || {};
  const sel = id => ($(`#${id} .opt.on`) || {}).dataset?.v || '';
  commitTicket({ ...old, eventId:S.eventId, customerId:cid, status: sel('t_status') || '未案内', seat: sel('t_seat'),
    qty: String(num($('#t_qty').textContent)), price: $('#t_price').value.replace(/[^\d]/g,''), memo: $('#t_memo').value });
  closeSheet(); toast('保存しました');
}

/* ---- 顧客 ---- */
function viewCustomers(){
  const gs = groups();
  return `
  <input class="search" placeholder="名前・ふりがな・会社名・電話で検索" value="${esc(S.cq)}" oninput="S.cq=this.value;renderCustList()">
  <div class="chips">
    <button class="chip ${S.cgroup==='all'?'on':''}" onclick="S.cgroup='all';render()">すべて<b>${S.customers.length}</b></button>
    ${gs.map(g => `<button class="chip ${S.cgroup===g?'on':''}" onclick="S.cgroup=this.dataset.g;render()" data-g="${esc(g)}">${esc(g)}<b>${S.customers.filter(c=>c.group===g).length}</b></button>`).join('')}
  </div>
  <div id="clist"></div>`;
}
function renderCustList(){
  const q = S.cq.trim().toLowerCase();
  const list = S.customers.filter(c => (S.cgroup === 'all' || c.group === S.cgroup) &&
    (!q || [c.name, c.kana, c.company, c.phone, c.group].join(' ').toLowerCase().includes(q))).sort(byKana);
  $('#clist').innerHTML = !list.length
    ? `<div class="empty">${S.customers.length ? '該当する人はいません' : 'まだ顧客が登録されていません<br>右下の＋から追加できます'}</div>`
    : `<div class="list">${list.map(c => `
      <div class="row" onclick="openCustomer('${esc(c.id)}')">
        <div class="row-main">
          <div class="nm">${esc(c.name)}<span class="hon">${esc(c.honorific)}</span></div>
          <div class="meta">${c.group?`<span class="tag">${esc(c.group)}</span>`:''}${c.company?`<span>${esc(c.company)}</span>`:''}${c.phone?`<span>${esc(c.phone)}</span>`:''}</div>
        </div><span class="muted">›</span>
      </div>`).join('')}</div>`;
}
function openCustomer(id){
  const c = S.customers.find(x => x.id === id) || { honorific:'様' };
  const hist = id ? S.tickets.filter(t => t.customerId === id).map(t => ({ t, e: S.events.find(e => e.id === t.eventId) }))
    .filter(x => x.e).sort((a,b) => b.e.date.localeCompare(a.e.date)) : [];
  const f = (k, label, attrs='') => `<div class="f"><label class="fl">${label}</label><input class="inp" id="c_${k}" value="${esc(c[k])}" ${attrs}></div>`;
  openSheet(`
    <h2>${id ? '顧客を編集' : '顧客を追加'}</h2>
    ${c.phone ? `<div class="links"><a href="tel:${esc(c.phone)}">📞 電話する</a><a href="sms:${esc(c.phone)}">💬 SMS</a></div>` : ''}
    <div class="two">${f('name','氏名 *')}${f('kana','ふりがな')}</div>
    <div class="two">
      <div class="f"><label class="fl">敬称</label><select class="inp" id="c_honorific">
        ${['様','さん','くん','先輩','先生',''].map(h => `<option value="${h}" ${h===(c.honorific||'')?'selected':''}>${h||'（なし）'}</option>`).join('')}</select></div>
      ${f('group','関係性','list="glist" placeholder="例：ジム_先輩"')}
    </div>
    <datalist id="glist">${groups().map(g => `<option value="${esc(g)}">`).join('')}</datalist>
    <div class="two">${f('phone','電話番号','type="tel" inputmode="tel"')}${f('email','メール','type="email"')}</div>
    ${f('zip','郵便番号','inputmode="numeric" placeholder="4600000"')}
    ${f('addr1','住所1（都道府県・市区町村）')}
    ${f('addr2','住所2（番地・建物名）')}
    ${f('company','会社名')}
    <div class="f"><label class="fl">メモ</label><textarea class="inp" id="c_memo">${esc(c.memo)}</textarea></div>
    ${hist.length ? `<div class="sec"><label>チケット履歴</label><div class="hist">${hist.map(({t,e}) =>
      `<div><span>${esc(e.title)}</span><span><span class="pill s${sIdx(t.status)}" style="padding:2px 8px;min-width:0">${esc(t.status)}</span> ${num(t.qty)?num(t.qty)+'枚':''}</span></div>`).join('')}</div></div>` : ''}
    <div class="actions">
      <button class="btn" onclick="saveCustomerSheet('${esc(id||'')}')">保存</button>
      ${id ? `<button class="btn danger" onclick="armDelete(this,()=>removeCustomer('${esc(id)}'))">削除</button>` : ''}
    </div>`);
}
function saveCustomerSheet(id){
  const keys = ['name','kana','honorific','group','phone','email','zip','addr1','addr2','company','memo'];
  const c = { ...(S.customers.find(x => x.id === id) || {}) };
  keys.forEach(k => c[k] = $('#c_' + k).value.trim());
  if (!c.name) { toast('氏名を入力してください'); return; }
  c.zip = c.zip.replace(/[^\d]/g, '');
  closeSheet();
  batch([{ op:'upsert', key:'customers', obj:c }]).then(([saved]) => { replaceLocal('customers', saved); render(); toast('保存しました'); }).catch(fail);
}
function removeCustomer(id){
  closeSheet();
  S.customers = S.customers.filter(x => x.id !== id); S.tickets = S.tickets.filter(t => t.customerId !== id); render();
  batch([{ op:'remove', key:'customers', id }, { op:'removeWhere', key:'tickets', field:'customerId', value:id }]).then(() => toast('削除しました')).catch(fail);
}

/* ---- 試合 ---- */
function viewEvents(){
  if (!S.events.length) return '<div class="empty">まだ試合が登録されていません<br>右下の＋から追加できます</div>';
  return [...S.events].sort((a,b) => b.date.localeCompare(a.date)).map(e => {
    const ts = S.tickets.filter(t => t.eventId === e.id && isSold(t.status));
    const q = ts.reduce((s,t) => s + num(t.qty), 0), a = ts.reduce((s,t) => s + num(t.qty) * num(t.price), 0);
    return `<div class="card" onclick="openEvent('${esc(e.id)}')" style="cursor:pointer">
      <div class="muted">${fmtDate(e.date)}${e.venue ? '・' + esc(e.venue) : ''}</div>
      <div class="nm" style="font-size:17px;margin-top:2px">${esc(e.title)}</div>
      <div class="meta" style="margin-top:8px"><span class="tag">確定 ${q}枚</span><span class="tag">${yen(a)}</span></div>
      <div class="meta" style="margin-top:6px">${seatsFor(e.id).map(x => `<span>${esc(x.name)} ${yen(x.price)}</span>`).join('<span>／</span>')}</div>
    </div>`;
  }).join('');
}

/* 試合の編集（席種・価格もこの画面で試合ごとに設定） */
let EV = null, seatDraft = [];
function openEvent(id){
  const e = S.events.find(x => x.id === id);
  if (e) {
    EV = { ...e };
    const own = S.seats.some(x => x.eventId === id);
    // この試合の席種がまだ無ければ、共通の席種を下書きに（保存するとこの試合専用になる）
    seatDraft = seatsFor(id).map(x => ({ id: own ? x.id : '', name: x.name, price: String(x.price), orig: x.name }));
  } else {
    EV = { id: '', title: '', date: new Date().toISOString().slice(0,10), venue: '', memo: '' };
    // 新しい試合は、いちばん最近の試合の席種をコピー
    const latest = [...S.events].sort((a,b) => b.date.localeCompare(a.date))[0];
    seatDraft = seatsFor(latest && latest.id).map(x => ({ id: '', name: x.name, price: String(x.price), orig: '' }));
  }
  renderEventSheet();
}
function readEventInputs(){
  if (!$('#e_title')) return;
  EV.title = $('#e_title').value; EV.date = $('#e_date').value; EV.venue = $('#e_venue').value; EV.memo = $('#e_memo').value;
  document.querySelectorAll('#seatRows .seatrow').forEach((r, i) => {
    seatDraft[i].name = r.querySelector('.sn').value;
    seatDraft[i].price = r.querySelector('.sp').value.replace(/[^\d]/g, '');
  });
}
function renderEventSheet(){
  const id = EV.id;
  openSheet(`
    <h2>${id ? '試合を編集' : '試合を追加'}</h2>
    <div class="f"><label class="fl">試合名 *</label><input class="inp" id="e_title" value="${esc(EV.title)}" placeholder="例：12月 ライト級8回戦"></div>
    <div class="two">
      <div class="f"><label class="fl">日付</label><input class="inp" type="date" id="e_date" value="${esc(EV.date)}"></div>
      <div class="f"><label class="fl">会場</label><input class="inp" id="e_venue" value="${esc(EV.venue)}"></div>
    </div>
    <div class="sec"><label>席種・価格（この試合）</label>
      <div id="seatRows">${seatDraft.map((x, i) => `
        <div class="seatrow" style="display:grid;grid-template-columns:minmax(0,1fr) 96px 34px 34px 34px;gap:6px;align-items:center;margin-bottom:8px">
          <input class="inp sn" value="${esc(x.name)}" placeholder="例：リングサイド">
          <input class="inp sp" value="${esc(x.price)}" inputmode="numeric" placeholder="価格">
          <button class="opt" style="padding:8px 0" onclick="moveSeat(${i},-1)" ${i===0?'disabled':''}>↑</button>
          <button class="opt" style="padding:8px 0" onclick="moveSeat(${i},1)" ${i===seatDraft.length-1?'disabled':''}>↓</button>
          <button class="opt" style="padding:8px 0;color:var(--accent)" onclick="removeSeat(${i})">✕</button>
        </div>`).join('')}</div>
      <button class="btn ghost" onclick="addSeat()">＋ 席種を追加</button>
      ${id ? '<div class="muted" style="margin-top:6px">名前を変えると、この試合のチケットの席種名も変わります。</div>' : ''}
    </div>
    <div class="f"><label class="fl">メモ</label><textarea class="inp" id="e_memo">${esc(EV.memo)}</textarea></div>
    <div class="actions">
      <button class="btn" onclick="saveEventSheet()">保存</button>
      ${id ? `<button class="btn ghost" onclick="closeSheet();S.eventId='${esc(id)}';S.tab='tickets';render()">この試合のチケットを開く</button>
              <button class="btn danger" onclick="armDelete(this,()=>removeEvent('${esc(id)}'))">削除（チケット記録も消えます）</button>` : ''}
    </div>`);
}
function addSeat(){ readEventInputs(); seatDraft.push({ id:'', name:'', price:'', orig:'' }); const y = $('#sheet').scrollTop; renderEventSheet(); $('#sheet').scrollTop = y;
  const ins = document.querySelectorAll('#seatRows .sn'); ins[ins.length - 1].focus(); }
function removeSeat(i){ readEventInputs(); seatDraft.splice(i, 1); const y = $('#sheet').scrollTop; renderEventSheet(); $('#sheet').scrollTop = y; }
function moveSeat(i, d){ readEventInputs(); const j = i + d; [seatDraft[i], seatDraft[j]] = [seatDraft[j], seatDraft[i]];
  const y = $('#sheet').scrollTop; renderEventSheet(); $('#sheet').scrollTop = y; }
function newId(){ return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-6); }

function saveEventSheet(){
  readEventInputs();
  const e = { ...EV, title: EV.title.trim(), venue: EV.venue.trim() };
  if (!e.title) { toast('試合名を入力してください'); return; }
  const list = seatDraft.map(x => ({ ...x, name: x.name.trim(), price: num(x.price) })).filter(x => x.name);
  const names = list.map(x => x.name);
  if (new Set(names).size !== names.length) { toast('同じ名前の席種があります'); return; }
  const isNew = !e.id;
  if (isNew) e.id = newId();
  delete e.updatedAt;
  const ops = [
    { op:'upsert', key:'events', obj: e },
    { op:'removeWhere', key:'seats', field:'eventId', value: e.id },
    ...list.map((x, i) => ({ op:'upsert', key:'seats', obj: { id: x.id || newId(), eventId: e.id, name: x.name, price: String(x.price), order: String(i) } })),
  ];
  // 席種名を変えたら、この試合のチケットの席種名も合わせる
  list.forEach(x => {
    if (x.orig && x.orig !== x.name) S.tickets.filter(t => t.eventId === e.id && t.seat === x.orig)
      .forEach(t => ops.push({ op:'upsert', key:'tickets', obj: { id: t.id, seat: x.name } }));
  });
  closeSheet();
  batch(ops).then(() => { if (isNew || !S.eventId) S.eventId = e.id; toast('保存しました'); load(); }).catch(fail);
}
function removeEvent(id){
  closeSheet();
  S.events = S.events.filter(x => x.id !== id); S.tickets = S.tickets.filter(t => t.eventId !== id);
  if (S.eventId === id) S.eventId = defaultEvent(); render();
  batch([{ op:'remove', key:'events', id }, { op:'removeWhere', key:'tickets', field:'eventId', value:id },
         { op:'removeWhere', key:'seats', field:'eventId', value:id }]).then(() => toast('削除しました')).catch(fail);
}

/* ========= シート（下から出るパネル） ========= */
function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#ov').classList.add('open'); $('#sheet').scrollTop = 0; }
function closeSheet(){ $('#ov').classList.remove('open'); }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
function armDelete(btn, fn){
  if (btn.classList.contains('armed')) return fn();
  btn.classList.add('armed'); btn.dataset.t = btn.textContent; btn.textContent = 'もう一度押すと削除します';
  setTimeout(() => { btn.classList.remove('armed'); btn.textContent = btn.dataset.t; }, 3000);
}

/* ========= タブ ========= */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0,0); });

load();
</script>
</body>
</html>
